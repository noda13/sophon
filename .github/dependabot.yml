version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # 公開から 3 日たった版だけを提案する。pnpm の minimumReleaseAge（4320 分）と合わせている。
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
