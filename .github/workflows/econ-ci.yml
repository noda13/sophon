name: CI (econ)

on:
  push:
    branches: [main]
    paths:
      - 'apps/econ/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/econ-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/econ/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/econ-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # main pushes must run to completion
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend & scripts (type-check & test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        env:
          DATABASE_URL: 'file:./dev.db'
        run: pnpm --filter ./apps/econ/backend run prisma:generate

      - name: Type check
        run: pnpm --filter ./apps/econ/backend exec tsc --noEmit

      - name: Type check scripts
        working-directory: apps/econ
        run: pnpm run type-check:scripts

      - name: Unit tests
        working-directory: apps/econ
        run: pnpm test

  frontend:
    name: Frontend (type-check & build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm --filter ./apps/econ/frontend run type-check

      - name: Build
        run: pnpm --filter ./apps/econ/frontend run build
