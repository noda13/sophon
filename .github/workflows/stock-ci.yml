name: CI (stock)

on:
  push:
    branches: [main]
    paths:
      - 'apps/stock/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/stock-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/stock/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/stock-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # main への push 連続時に途中のrunを潰すと検証されないコミットが生じるため、PR のみキャンセル対象にする
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter ./apps/stock/backend exec prisma generate

      - name: Type-check backend
        run: pnpm --filter ./apps/stock/backend run build

      - name: Validate Prisma schema
        run: pnpm --filter ./apps/stock/backend exec prisma validate
        env:
          DATABASE_URL: file:./ci.db

      - name: Run backend tests
        run: pnpm --filter ./apps/stock/backend run test

      - name: Type-check frontend
        run: pnpm --filter ./apps/stock/frontend run type-check

      - name: Run frontend tests
        run: pnpm --filter ./apps/stock/frontend run test

      - name: Build frontend
        run: pnpm --filter ./apps/stock/frontend run build
