name: CI (tech)

on:
  push:
    branches: [main]
    paths:
      - 'apps/tech/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/tech-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/tech/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/tech-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only; a main push must always finish so every merged commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check (root)
        run: pnpm --filter ./apps/tech exec tsc --noEmit

      - name: Type-check (frontend)
        run: pnpm --filter ./apps/tech/frontend type-check

      - name: Build (frontend)
        run: pnpm --filter ./apps/tech/frontend build
