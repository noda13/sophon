services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: waga-scope-backend
    environment:
      DATABASE_URL: file:./dev.db
      NODE_ENV: development
      PORT: 8902
      HOST: 0.0.0.0
      TZ: Asia/Tokyo
      DATA_PROVIDER: ${DATA_PROVIDER:-csv}
      JQUANTS_API_KEY: ${JQUANTS_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MARKET_CAP_MAX_YEN: ${MARKET_CAP_MAX_YEN:-50000000000}
      NET_CASH_RATIO_MIN: ${NET_CASH_RATIO_MIN:-0.3}
      MVP_STOCK_LIMIT: ${MVP_STOCK_LIMIT:-30}
      PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1
    ports:
      - "8902:8902"
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
      - ./backend/seed:/app/backend/seed
      - backend_data:/app/backend/prisma/migrations

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: waga-scope-frontend
    ports:
      - "3902:3902"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    environment:
      VITE_API_URL: http://backend:8902

volumes:
  backend_data:
